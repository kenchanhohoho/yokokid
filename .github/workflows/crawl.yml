name: Crawl events

on:
  schedule:
    # Daily at 04:00 UTC = 13:00 JST
    - cron: "0 4 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "crawler/**"
      - ".github/workflows/crawl.yml"

permissions:
  contents: write

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: crawler/requirements.txt

      - name: Install dependencies
        run: pip install -r crawler/requirements.txt

      - name: Run crawler
        run: python -m crawler.crawl

      - name: Commit updated events.json
        run: |
          if [[ -n "$(git status --porcelain public/data/events.json)" ]]; then
            git config user.name "yokokid-bot"
            git config user.email "actions@users.noreply.github.com"
            git add public/data/events.json
            git commit -m "chore: refresh events.json ($(date -u +%Y-%m-%dT%H:%MZ))"
            git push
          else
            echo "no changes"
          fi
